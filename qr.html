<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenifah Birthday Card QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
        }

        .message {
            color: #764ba2;
            font-size: 1.2rem;
            margin: 20px 0;
            font-weight: bold;
        }

        .heart {
            color: #ff1744;
            font-size: 2rem;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
        }

        .link-text {
            color: #667eea;
            word-break: break-all;
            margin-top: 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>🎉 Happy Birthday! 🎉</h1>
        <p class="subtitle">Jenifah</p>
        
        <p class="message">Scan this QR code to see your birthday card ✨</p>
        
        <div id="qrcode"></div>
        
        <div class="info">
            📱 Open the link with your phone camera or any QR scanner
        </div>
        
        <div class="link-text">
            Or visit: <br>
            <strong>raw.githubusercontent.com/mdarkanchy886-hub/jenifah-birthday-card/main/index.html</strong>
        </div>
    </div>

    <script>
        // Generate QR code
        new QRCode(document.getElementById("qrcode"), {
            text: "https://raw.githubusercontent.com/mdarkanchy886-hub/jenifah-birthday-card/main/index.html",
            width: 250,
            height: 250,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
